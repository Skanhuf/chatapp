stages:
  - lint
  - test
  - build
  - deploy

# Backend linting
lint-backend:
  stage: lint
  image: python:3.12-slim
  before_script:
    - cd backend && pip install --no-cache-dir ruff
  script:
    - ruff check .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Backend tests
test-backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd backend && pip install --no-cache-dir -r requirements.txt
  script:
    - cd backend && pytest tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Frontend linting
lint-frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci
  script:
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Frontend tests
test-frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci
  script:
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Build Docker images
build-docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker compose build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Deploy to server
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh root@$DEPLOY_HOST "cd ~/ChatAPP && git pull origin main && docker compose up -d --build"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: manual
