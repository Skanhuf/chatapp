stages:
  - lint
  - test
  - build
  - deploy

# Backend linting
lint-backend:
  stage: lint
  image: golang:1.23-alpine
  before_script:
    - cd backend && go mod download
  script:
    - go vet ./...
  only:
    - merge_requests
    - main

# Backend tests
test-backend:
  stage: test
  image: golang:1.23-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres-test
  variables:
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_DB: testdb
  before_script:
    - cd backend && go mod download
  script:
    - go test -v -cover ./internal/...
  only:
    - merge_requests
    - main

# Frontend linting
lint-frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci
  script:
    - npm run lint
  only:
    - merge_requests
    - main

# Frontend tests
test-frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci
  script:
    - npm test
  only:
    - merge_requests
    - main

# Build Docker images
build-docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker compose build
  only:
    - main

# Deploy to server
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh root@$DEPLOY_HOST "cd ~/ChatAPP && git pull origin main && docker compose up -d --build"
  only:
    - main
  when: manual
