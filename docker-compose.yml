services:
  backend:
    build: ./backend
    container_name: chat_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://chatuser:changepass@db:5432/chatapp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatnet

  frontend:
    build: ./frontend
    container_name: chat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - chatnet

  db:
    image: postgres:16-alpine
    container_name: chat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: changepass
      POSTGRES_DB: chatapp
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatnet

volumes:
  pg_data:

networks:
  chatnet:
    driver: bridge
