services:
  backend:
    build: ./backend
    container_name: chat_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_PATH: /data/chat.db
    volumes:
      - chat_data:/data
    networks:
      - chatnet

  frontend:
    build: ./frontend
    container_name: chat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - chatnet

volumes:
  chat_data:

networks:
  chatnet:
    driver: bridge
