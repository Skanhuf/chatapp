[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatapp-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.1",
    "pydantic-settings>=2.5.2",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "BLE", "A", "C4", "DTZ", "T10", "T20", "PIE", "TID", "Q", "RSE", "RET", "FLY", "PERF", "FURB"]
ignore = ["B008", "S110", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S311"]
